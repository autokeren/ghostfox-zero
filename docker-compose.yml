services:
  ghostfox-zero:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: ghostfox-zero
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      # The control layer needs the docker socket to spawn sandbox containers.
      # NOTE: this is the control plane only — the SANDBOX containers
      # themselves get NO host mounts, keeping the containment contract.
      - /var/run/docker.sock:/var/run/docker.sock
      # Sibling-container trick: the control layer passes host paths to the
      # docker daemon when spawning sandbox containers. Sharing /tmp keeps
      # artifact paths identical inside and outside.
      - /tmp:/tmp
    restart: unless-stopped
