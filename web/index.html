<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghostfox Zero — zero blast radius</title>
<style>
  :root { --bg:#0b0f14; --panel:#121820; --ink:#e8eef4; --dim:#8b98a5; --fox:#ff7a1a; --ok:#2fbf71; --bad:#e5484d; }
  * { box-sizing: border-box; margin: 0; }
  body { background:var(--bg); color:var(--ink); font-family: ui-monospace, "SF Mono", Menlo, monospace; min-height:100vh; display:flex; flex-direction:column; }
  header { padding:18px 24px; border-bottom:1px solid #1d2733; display:flex; align-items:center; gap:12px; }
  header .logo { font-size:20px; color:var(--fox); }
  header h1 { font-size:15px; font-weight:600; letter-spacing:.5px; }
  header .sub { color:var(--dim); font-size:11px; margin-left:auto; text-align:right }
  main { flex:1; display:grid; grid-template-columns: 1fr 1fr; gap:16px; padding:20px; max-width:1200px; width:100%; margin:0 auto; }
  .panel { background:var(--panel); border:1px solid #1d2733; border-radius:10px; padding:16px; }
  .panel h2 { font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:12px; }
  textarea { width:100%; height:84px; background:#0d131a; color:var(--ink); border:1px solid #243140; border-radius:8px; padding:10px; font:inherit; resize:vertical; }
  button { background:var(--fox); border:0; color:#141414; font:inherit; font-weight:700; padding:10px 18px; border-radius:8px; cursor:pointer; margin-top:10px; }
  button:disabled { background:#333d4a; color:#777; cursor:not-allowed; }
  #log { height:260px; overflow-y:auto; font-size:12px; line-height:1.7; white-space:pre-wrap; word-break:break-word; }
  #log .phase { color:var(--fox); } #log .err { color:var(--bad); } #log .dim { color:var(--dim); }
  #shots { display:flex; flex-direction:column; gap:10px; max-height:520px; overflow-y:auto; }
  #shots img { width:100%; border:1px solid #243140; border-radius:8px; }
  #gate { display:none; margin-top:12px; padding:12px; border:1px solid var(--fox); border-radius:8px; background:#1a1207; }
  #gate p { font-size:12px; margin-bottom:10px; color:var(--fox); }
  #gate .row { display:flex; gap:10px; }
  #gate .approve { background:var(--ok); } #gate .reject { background:var(--bad); color:#fff; }
  #status { margin-top:8px; font-size:11px; color:var(--dim); }
</style>
</head>
<body>
<header>
  <span class="logo">🦊</span>
  <h1>Ghostfox Zero <span style="color:var(--dim)">// zero blast radius</span></h1>
  <div class="sub">Vultr Serverless Inference · sandboxed Playwright</div>
</header>
<main>
  <section class="panel">
    <h2>Mission</h2>
    <textarea id="goal" placeholder="e.g. Go to https://example.com, fill the contact form with name Fox and message Hello, show me before you submit."></textarea>
    <button id="go">Deploy the fox</button>
    <div id="status">idle</div>

    <h2 style="margin-top:18px">Human approval gate</h2>
    <div id="gate">
      <p>⚠️ Final action detected — review before the fox commits anything.</p>
      <img id="gateShot" alt="latest screenshot">
      <div class="row">
        <button class="approve" id="approveBtn">Approve</button>
        <button class="reject" id="rejectBtn">Reject</button>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>Live log</h2>
    <div id="log"></div>
    <h2 style="margin-top:18px">Verified screenshots</h2>
    <div id="shots"></div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
